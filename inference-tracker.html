b-ready"})]})}var ad=`# Prefix-Aware Inference Router

> Job-ready capstone: routes OpenAI-compatible requests across vLLM / SGLang / TensorRT-LLM based on prefix length, GPU availability, and cost. Built on RunPod L4 (workhorse $0.45/hr) + 4090 (speed demon).

## Architecture

\`\`\`mermaid
flowchart LR
  Client[Client - OpenAI API] --> Router{Router - RadixTree}
  Router -->|prefix_len < 1.5k| VLLM[vLLM L4 - 12.5k tok/s]
  Router -->|prefix_len >= 1.5k| SGL[SGLang L4 - 16.2k tok/s]
  Router -->|4090 free & batch>32| TRT[TRT-LLM 4090 - 21k tok/s]
  VLLM --> Grafana
  SGL --> Grafana
  TRT --> Grafana
  Router --> Metrics[(Prometheus -> Grafana)]
\`\`\`

Text fallback (divs version in tracker):
Client -> Router[RadixTree + selector] -> [vLLM L4 | SGLang L4 | TRT 4090] -> Prometheus/Grafana

## Why this exists
- vLLM V1 excels at continuous batching + prefix caching for short prefixes
- SGLang RadixAttention wins 29% on prefix-heavy (2k shared sys prompt) -> 16.2k vs 12.5k tok/s on L4
- TRT-LLM max single-model throughput on 4090 (21k tok/s) but no dynamic LoRA
- Router picks cheapest that meets TTFT SLO

## Quickstart

\`\`\`bash
# RunPod image
docker pull runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04

# Install
pip install vllm==0.6.3 sglang[all]==0.4.1 triton==3.0.0 fastapi uvicorn prometheus_client

# Launch backends (separate pods or tmux)
vllm serve meta-llama/Llama-3.1-8B --enable-prefix-caching --port 8001 &
python -m sglang.launch_server --model-path meta-llama/Llama-3.1-8B --port 30000 --enable-radix-cache &
trtllm-serve --model_path ./trt_engines/llama-8b-fp8 --port 8002 &

# Router
uvicorn router.main:app --host 0.0.0.0 --port 8000

# Test
curl localhost:8000/v1/chat/completions \\
  -H "Content-Type: application/json" \\
  -d '{"model":"llama-3.1-8B","messages":[{"role":"system","content":"You are... (2k token system)"},{"role":"user","content":"Explain RadixAttention"}]}'

## Router Logic

\`\`\`python
def select_engine(prefix_len: int, gpu_avail: dict, qps: float):
    # Heuristic from W4 decision doc
    if prefix_len >= 1500:
        return "sglang-l4"  # Radix wins
    if gpu_avail.get("4090") and qps > 20:
        return "trtllm-4090" # max throughput
    return "vllm-l4"

## What I learned (20yr ERP -> Inference)
- C++ thread-pool + LRU matters: prefill/decode disaggregation needs lock-free queues
- CUDA: coalescing > clever math, ncu is truth
- Triton fused RMSNorm+Residual 2.5x on 4090: 1 HBM pass vs 3
- Quant: FP8 on L4 is free lunch (Ada), INT4 only if VRAM bound
